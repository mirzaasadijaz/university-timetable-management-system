{% extends 'base.html' %}
{% block title %}403 — Access Denied{% endblock %}
{% block content %}
<div class='row justify-content-center mt-5'>
  <div class='col-md-5 text-center'>
    <div class='card shadow border-danger'>
      <div class='card-body py-5'>
        <i class='bi bi-shield-x text-danger' style='font-size:4rem'></i>
        <h1 class='display-4 fw-bold text-danger mt-3'>403</h1>
        <h4>Access Denied</h4>
        <p class='text-muted'>You don't have permission to view this page.</p>
        <a href='{{ url_for("dashboard.index") }}' class='btn btn-primary mt-2'>
          <i class='bi bi-house'></i> Go to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
