{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class='row justify-content-center mt-5'>
  <div class='col-md-5 text-center'>
    <div class='card shadow'>
      <div class='card-body py-5'>
        <i class='bi bi-search text-secondary' style='font-size:4rem'></i>
        <h1 class='display-4 fw-bold text-secondary mt-3'>404</h1>
        <h4>Page Not Found</h4>
        <p class='text-muted'>The page you are looking for doesn't exist or has been moved.</p>
        <a href='{{ url_for("dashboard.index") }}' class='btn btn-primary mt-2'>
          <i class='bi bi-house'></i> Go to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
